name: Compare pin feeds (temporary)
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://zentacalculator.com/pins/feed.xml https://zentaengineering.com/pins/feed.xml https://www.zentaengineering.com/pins/feed.xml http://zentaengineering.com/pins/feed.xml; do
            echo "===== $u"
            curl -s -A "Pinterestbot/1.0 (+http://www.pinterest.com/bot.html)" -D - -o /tmp/f.xml -w 'time %{time_total}s\n' -L "$u" | grep -viE '^(date|expires|x-turbo|alt-svc|report-to|nel):'
            head -c 700 /tmp/f.xml; echo
          done
          curl -s -I -A "Pinterestbot/1.0" https://zentaengineering.com/robots.txt | head -3; curl -s https://zentaengineering.com/robots.txt
