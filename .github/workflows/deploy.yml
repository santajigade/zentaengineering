# Builds the site and uploads it to Hostinger by FTP.
# Runs on every push to main, three times a day (so scheduled items go live), and on demand.
# Live site secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (FTP account rooted at zentaengineering.com/public_html)
# Preview site secrets (optional): PREVIEW_FTP_SERVER, PREVIEW_FTP_USERNAME, PREVIEW_FTP_PASSWORD
#   (FTP account rooted at the preview.zentaengineering.com folder). The preview includes unreviewed drafts.
name: Build and deploy to Hostinger
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0,6,12 * * *' # 06:00, 12:00 and 18:00 IST
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SSH (rsync) is used when SSH_HOST is set; otherwise FTP.
      # SSH secrets: SSH_HOST, SSH_PORT (Hostinger: 65002), SSH_USER, SSH_KEY (private key), SSH_PATH (e.g. domains/zentaengineering.com/public_html)
      - name: Upload live site over SSH
        if: env.HAS_SSH == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --exclude '.well-known' -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }}" dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/"
      - name: Upload live site over FTP
        if: env.HAS_SSH != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
  preview:
    runs-on: ubuntu-latest
    env:
      HAS_PREVIEW: ${{ secrets.PREVIEW_FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_PREVIEW == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_PREVIEW == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_PREVIEW == 'true'
      - run: PREVIEW=1 npm run build
        if: env.HAS_PREVIEW == 'true'
      - name: Upload preview site
        if: env.HAS_PREVIEW == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PREVIEW_FTP_SERVER }}
          username: ${{ secrets.PREVIEW_FTP_USERNAME }}
          password: ${{ secrets.PREVIEW_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
